{% set name = "starlette" %}
{% set version = "0.46.2" %}

package:
  name: {{ name|lower }}-recipe
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7f7361f34eed179294600af672f565727419830b54b7b084efe44bb82d2fccd5

build:
  number: 0
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - hatchling

outputs:
  - name: {{ name }}
    build:
      script: python -m pip install . --no-deps --no-build-isolation -vv
    requirements:
      host:
        - python
        - pip
        - hatchling
      run:
        - python
        - anyio >=3.6.2,<5
        - typing_extensions >=3.10.0  # [py<310]
    test:
      imports:
        - starlette
      requires:
        - pip
      commands:
        - pip check

  - name: {{ name }}-full
    build:
      script: echo Nothing to do.
      # httpx isn't available on s390x
      skip: true  # [s390x]
    requirements:
      host:
        - python
        - pip
      run:
        - python
        - {{ pin_subpackage('starlette', exact=True) }}
        - itsdangerous
        - jinja2
        - python-multipart >=0.0.18
        - pyyaml
        - httpx >=0.27.0,<0.29.0
    test:
      commands:
        - python -c "from starlette import *"

about:
  home: https://www.starlette.io/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.md
  summary: The little ASGI framework that shines
  description: |
    Starlette is a lightweight [ASGI](https://asgi.readthedocs.io/en/latest/) framework/toolkit.

    It is ideal for building high performance asyncio services, and supports
    both HTTP and WebSockets.
  doc_url: https://www.starlette.io/
  dev_url: https://github.com/encode/starlette/

extra:
  recipe-maintainers:
    - carlodri
    - dgasmith
